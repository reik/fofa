services:
  - type: web
    name: fofa-backend
    runtime: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --dns-result-order=ipv4first
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://reik.github.io/fofa
      - key: CORS_ORIGIN
        value: https://reik.github.io
      - key: DB_PATH
        value: /var/data/fofa.db
      - key: SEED_DUMMY_DATA
        value: "true"
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
    disk:
      name: fofa-data
      mountPath: /var/data
      sizeGB: 1
